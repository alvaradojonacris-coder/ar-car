<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>AR Car</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #gl{position:fixed;inset:0;width:100%;height:100%}
  #joy{position:fixed;left:16px;bottom:40px;width:140px;height:140px;border-radius:50%;background:#6668}
  #knob{position:absolute;left:40px;top:40px;width:60px;height:60px;border-radius:50%;background:#fff}
  .btn{position:fixed;border-radius:50%;background:#555b;color:#fff;border:0;font-weight:bold;font-size:13px;user-select:none;-webkit-user-select:none}
  .btn svg{width:58%;height:58%;pointer-events:none;display:block;margin:auto}
  #brake{right:14px;bottom:40px;width:68px;height:68px;background:#8a1c1cc0;border:3px solid #fff5}
  #rev{right:96px;bottom:40px;width:68px;height:68px}
  #rev.on{background:#888}
  #left{right:96px;bottom:120px;width:68px;height:68px}
  #right{right:14px;bottom:120px;width:68px;height:68px}
  .btn.blink{animation:bl .7s steps(1) infinite}
  @keyframes bl{0%{background:#ff9900}50%{background:#555b}}
  #brake.on{background:#ff2a2a}
  #msg{position:fixed;top:14px;width:100%;text-align:center;color:#fff;font-size:12px;pointer-events:none}
  #rot,#start{position:fixed;inset:0;background:#000;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:bold}
  #start{display:flex;z-index:20}
  #rot{display:none;z-index:10;font-weight:normal}
  @media (orientation:landscape){#rot{display:flex}}
  #joy{bottom:calc(36px + env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left))}
  #brake,#rev{bottom:calc(36px + env(safe-area-inset-bottom))}
  #left,#right{bottom:calc(116px + env(safe-area-inset-bottom))}
  #msg{top:calc(14px + env(safe-area-inset-top))}
  #recenter{top:calc(40px + env(safe-area-inset-top));right:14px;width:48px;height:48px}
  #ptr{position:fixed;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;display:none;pointer-events:none;z-index:5;color:#fff;text-align:center;font-size:11px;font-weight:bold}
  #ptr svg{width:100%;height:100%;filter:drop-shadow(0 0 3px #000)}
  #ptr span{position:absolute;left:-10px;right:-10px;bottom:-15px;text-shadow:0 0 3px #000}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="gl"></canvas>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="left"><svg viewBox="0 0 24 24"><path d="M18 4L5 12l13 8z" fill="#fff"/></svg></button>
<button class="btn" id="right"><svg viewBox="0 0 24 24"><path d="M6 4l13 8-13 8z" fill="#fff"/></svg></button>
<button class="btn" id="brake"><svg viewBox="0 0 24 24"><path d="M16.5 3.2L13.2 10.5" stroke="#ddd" stroke-width="2.2" stroke-linecap="round"/><circle cx="16.7" cy="3.4" r="1.7" fill="#fff"/><rect x="6" y="10" width="12.5" height="11.5" rx="2.5" fill="#fff"/><g stroke="#7a1515" stroke-width="1.3" stroke-linecap="round"><path d="M8.3 13.2h8"/><path d="M8.3 16h8"/><path d="M8.3 18.8h8"/></g></svg></button>
<button class="btn" id="rev"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><text x="12" y="13" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#fff" stroke="none">R</text><path d="M6.5 17.5L12 22l5.5-4.5"/></svg></button>
<button class="btn" id="recenter"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
<div id="ptr"><svg id="pa" viewBox="0 0 24 24"><path d="M20 12L4 4l4 8-4 8z" fill="#ffb300" stroke="#000" stroke-width="1"/></svg><span id="pd"></span></div>
<div id="msg"></div>
<div id="start">TAP TO START</div>
<div id="rot">Rotate your phone<br>to portrait</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), msg = $('msg');

// ---------- Camera (AR background) ----------
async function startCam(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    cam.srcObject = s; msg.textContent = '';
  }catch(e){ msg.textContent = 'Camera not available - open over https and allow the camera'; }
}
$('start').addEventListener('click',async()=>{
  $('start').style.display='none';
  initMotion();                       // must run inside the tap (iOS permission)
  startedAt=performance.now();
  startCam();
  const el=document.documentElement;
  try{ if(el.requestFullscreen) await el.requestFullscreen(); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('portrait'); }catch(e){}
});

// ---------- Scene ----------
const renderer = new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,1,0.1,1000);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.5));
const sun = new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(4,8,5); scene.add(sun);

// reflections environment (makes the paint look glossy)
try{
  const e=new THREE.Scene();
  const g=new THREE.SphereGeometry(50,32,16);
  const pos=g.attributes.position, cols=[];
  const top=new THREE.Color(0xe6f2ff), mid=new THREE.Color(0x8c8c8c), bot=new THREE.Color(0x151515);
  for(let i=0;i<pos.count;i++){
    const y=pos.getY(i)/50;
    const c=y>0?mid.clone().lerp(top,y):mid.clone().lerp(bot,-y);
    cols.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  e.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const wm=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide});
  const p1=new THREE.Mesh(new THREE.PlaneGeometry(30,10),wm); p1.position.set(0,40,0); p1.rotation.x=Math.PI/2; e.add(p1);
  const p2=new THREE.Mesh(new THREE.PlaneGeometry(24,8),wm); p2.position.set(-40,12,0); p2.rotation.y=Math.PI/2; e.add(p2);
  const p3=new THREE.Mesh(new THREE.PlaneGeometry(24,8),wm); p3.position.set(40,12,0); p3.rotation.y=Math.PI/2; e.add(p3);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(e,0.02).texture;
}catch(err){ console.log('env failed',err); }

// ---------- Realistic-ish car ----------
const L=4.2, W=1.7, S=1.0;   // S = car size
const paint=new THREE.MeshPhysicalMaterial({color:0x070707,metalness:0.55,roughness:0.28,clearcoat:1,clearcoatRoughness:0.04});
const redPaint=new THREE.MeshPhysicalMaterial({color:0xb00000,metalness:0.45,roughness:0.28,clearcoat:1,clearcoatRoughness:0.04});
const glassM=new THREE.MeshPhysicalMaterial({color:0x0a121c,metalness:0.9,roughness:0.06});
const trim=new THREE.MeshStandardMaterial({color:0x050505,roughness:0.6});
const tireM=new THREE.MeshStandardMaterial({color:0x151515,roughness:0.9});
const rimM=new THREE.MeshStandardMaterial({color:0xb8bcc4,metalness:1,roughness:0.25});
const headM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff2c0,emissiveIntensity:1.6});
const tailM=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff0000,emissiveIntensity:0.8});
const plateM=new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:0.5});
paint.envMapIntensity=0.7; glassM.envMapIntensity=0.8; redPaint.envMapIntensity=0.7;

// side profile extruded across the width. shape x = along length (0 = front), y = height
function part(pts,depth,mat,b){
  const shape=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:depth,bevelEnabled:b>0,bevelThickness:b,bevelSize:b,bevelSegments:3,steps:1,curveSegments:8});
  geo.translate(-L/2,0,-depth/2);
  geo.rotateY(-Math.PI/2);          // length now runs along z, front at -z
  return new THREE.Mesh(geo,mat);
}
const car=new THREE.Group();
const model=new THREE.Group(); car.add(model);

// lower body
model.add(part([[0,0.28],[0,0.56],[0.3,0.72],[1.45,0.86],[3.9,0.9],[4.2,0.84],[4.2,0.32],[3.9,0.28]],W-0.1,redPaint,0.05));
// cabin (roof + pillars) and glass
model.add(part([[1.45,0.86],[2.1,1.36],[3.2,1.36],[3.85,0.9]],1.4,paint,0.03));
model.add(part([[1.43,0.86],[2.02,1.31],[3.3,1.31],[3.88,0.88]],1.43,glassM,0));
// front lip, side skirts, grille, headlights
const lip=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.25),trim); lip.position.set(0,0.27,-2.05); model.add(lip);
const hoodP=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.03,1.1),paint); hoodP.position.set(0,0.85,-1.22); hoodP.rotation.x=-0.121; model.add(hoodP);
const grille=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.13,0.05),trim); grille.position.set(0,0.42,-2.15); model.add(grille);
[-0.58,0.58].forEach(x=>{
  const h=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.12,0.07),headM);
  h.position.set(x,0.67,-1.97); h.rotation.x=0.6; model.add(h);
});
// tail lights, plate, spoiler, mirrors
const tl=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.1,0.05),tailM); tl.position.set(0,0.74,2.14); model.add(tl);
[-0.62,0.62].forEach(x=>{ const t=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.15,0.05),tailM); t.position.set(x,0.64,2.14); model.add(t); });
const plate=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.03),plateM); plate.position.set(0,0.47,2.16); model.add(plate);
const revM=new THREE.MeshStandardMaterial({color:0x888888,emissive:0xffffff,emissiveIntensity:0});
[-0.5,0.5].forEach(x=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.08,0.05),revM); r.position.set(x,0.48,2.15); model.add(r); });
const wing=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.04,0.32),paint); wing.position.set(0,1.1,1.95); model.add(wing);
[-0.6,0.6].forEach(x=>{ const u=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.1),trim); u.position.set(x,1.0,1.9); model.add(u); });
[-0.9,0.9].forEach(x=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.1,0.2),redPaint); m.position.set(x,1.0,-0.7); model.add(m); });

// turn indicator lamps (front corners, rear corners, side repeaters)
const indL=new THREE.MeshStandardMaterial({color:0x4a2a00,emissive:0xff9900,emissiveIntensity:0});
const indR=indL.clone();
[[-1,indL],[1,indR]].forEach(pair=>{
  [[0.72,0.46,-2.14,0.2,0.1,0.05],[0.8,0.5,2.15,0.2,0.1,0.05],[0.82,0.62,-1.85,0.04,0.07,0.2]].forEach(p=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]),pair[1]);
    m.position.set(pair[0]*p[0],p[1],p[2]); model.add(m);
  });
});

// wheels
const WR=0.34;
function makeWheel(x,z,front){
  const pivot=new THREE.Group(); pivot.position.set(x,WR,z);
  const spin=new THREE.Group(); pivot.add(spin);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(WR,WR,0.24,28),tireM); tire.rotation.z=Math.PI/2; spin.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(WR*0.68,WR*0.68,0.25,24),rimM); rim.rotation.z=Math.PI/2; spin.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.27,12),trim); hub.rotation.z=Math.PI/2; spin.add(hub);
  for(let i=0;i<5;i++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.255,0.42,0.05),trim);
    s.rotation.x=i*Math.PI/5*2*0.5; spin.add(s);
  }
  model.add(pivot);
  return {pivot,spin,front};
}
const wheels=[makeWheel(-0.87,-1.35,true),makeWheel(0.87,-1.35,true),makeWheel(-0.87,1.3,false),makeWheel(0.87,1.3,false)];

scene.add(car);
car.visible=false;
car.scale.set(S,S,S);

// soft ground shadow
const sc=document.createElement('canvas'); sc.width=sc.height=128;
const sx=sc.getContext('2d'); const gr=sx.createRadialGradient(64,64,4,64,64,62);
gr.addColorStop(0,'rgba(0,0,0,0.75)'); gr.addColorStop(1,'rgba(0,0,0,0)');
sx.fillStyle=gr; sx.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.9,5.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.position.y=0.01; shadow.scale.set(S,S,1); shadow.visible=false; scene.add(shadow);

// ---------- Controls ----------
const st={jx:0,jy:0,left:false,right:false,brake:false,rev:false,heading:0,v:0,steer:0};
const joy=$('joy'), knob=$('knob'); let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2);
  const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
  st.jx=dx; st.jy=dy;
  knob.style.left=(40+dx*40)+'px'; knob.style.top=(40+dy*40)+'px';
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e);});
const joyEnd=()=>{joyId=null;st.jx=st.jy=0;knob.style.left=knob.style.top='40px';};
joy.addEventListener('pointerup',joyEnd); joy.addEventListener('pointercancel',joyEnd);
function hold(id,key){
  const b=$(id);
  b.addEventListener('pointerdown',e=>{st[key]=true;b.classList.add('on');b.setPointerCapture(e.pointerId);});
  const up=()=>{st[key]=false;b.classList.remove('on');};
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
}
hold('brake','brake'); hold('rev','rev');
// left / right arrows = turn indicators (tap to switch on, tap again to switch off)
st.ind=0;
function setInd(d){
  st.ind = (st.ind===d) ? 0 : d;
  $('left').classList.toggle('blink',st.ind===-1);
  $('right').classList.toggle('blink',st.ind===1);
}
$('left').addEventListener('click',()=>setInd(-1));
$('right').addEventListener('click',()=>setInd(1));

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// ---------- Tire marks on the ground ----------
const markGeo=new THREE.PlaneGeometry(0.22*S,0.7*S);
const marks=[]; let markI=0;
for(let i=0;i<160;i++){
  const m=new THREE.Mesh(markGeo,new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0,depthWrite:false}));
  m.rotation.order='YXZ'; m.rotation.x=-Math.PI/2; m.position.y=0.015; m.visible=false;
  m.userData={born:0,base:0}; scene.add(m); marks.push(m);
}
function addMark(lx,lz,alpha,now){
  const h=st.heading,c=Math.cos(h),sn=Math.sin(h);
  const m=marks[markI++%marks.length];
  m.position.x=car.position.x+lx*c+lz*sn;
  m.position.z=car.position.z-lx*sn+lz*c;
  m.rotation.y=h; m.userData.born=now; m.userData.base=alpha; m.visible=true;
}

// ---------- AR camera: phone motion sensors turn the view, the car stays in the world ----------
camera.position.set(0,1.5,0);
const D=Math.PI/180, zee=new THREE.Vector3(0,0,1), eul=new THREE.Euler(), q0=new THREE.Quaternion(),
      q1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)), tq=new THREE.Quaternion(), tmp=new THREE.Vector3();
const gyro={on:false,first:true,a:0,b:0,g:0}, look={yaw:0,pitch:-0.15};
let startedAt=0, placed=false, gyroPlaced=false, camYaw=0;

function onOri(e){ if(e.alpha==null||e.beta==null) return; gyro.on=true; gyro.a=e.alpha; gyro.b=e.beta; gyro.g=e.gamma||0; }
function initMotion(){
  const add=()=>addEventListener('deviceorientation',onOri,true);
  const DO=window.DeviceOrientationEvent;
  if(DO && typeof DO.requestPermission==='function'){
    DO.requestPermission().then(r=>{ if(r==='granted') add(); else msg.textContent='Motion access denied - drag the screen to look around'; }).catch(add);
  }else add();
}
// no sensors (desktop): drag the screen to look around
let dragId=null,lx=0,ly=0; const glc=$('gl');
glc.addEventListener('pointerdown',e=>{dragId=e.pointerId;lx=e.clientX;ly=e.clientY;});
glc.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId||gyro.on) return;
  look.yaw+=(e.clientX-lx)*0.005; look.pitch=Math.max(-1.3,Math.min(0.8,look.pitch+(e.clientY-ly)*0.005));
  lx=e.clientX; ly=e.clientY;
});
glc.addEventListener('pointerup',()=>dragId=null); glc.addEventListener('pointercancel',()=>dragId=null);

function updateCam(){
  if(gyro.on){
    const o=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D;
    eul.set(gyro.b*D,gyro.a*D,-gyro.g*D,'YXZ'); tq.setFromEuler(eul); tq.multiply(q1); tq.multiply(q0.setFromAxisAngle(zee,-o));
    if(gyro.first){camera.quaternion.copy(tq);gyro.first=false;} else camera.quaternion.slerp(tq,0.35);
  }else{ eul.set(look.pitch,look.yaw,0,'YXZ'); camera.quaternion.setFromEuler(eul); }
  const f=tmp.set(0,0,-1).applyQuaternion(camera.quaternion);
  let fx=f.x,fz=f.z;
  if(Math.hypot(fx,fz)<0.35){                       // phone pointing at the floor / sky: use screen-up instead
    const u=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion), sg=f.y<0?1:-1;
    fx=u.x*sg; fz=u.z*sg;
  }
  camYaw=Math.atan2(-fx,-fz);                       // direction the phone looks at, same convention as car heading
}
function recenter(){                                // put the car on the ground in front of the camera
  // drop the car on the floor you see, at the bottom of the screen (not the center), however the phone is held
  camera.updateMatrixWorld();
  const dr=new THREE.Vector3(0,-0.55,0.5).unproject(camera).sub(camera.position).normalize();
  let px,pz,hc=1.5;
  if(dr.y<-0.05){
    const t0=1.5/-dr.y, d0=Math.hypot(dr.x,dr.z)*t0;          // where the screen-bottom ray meets the floor
    const k=Math.max(0.4,Math.min(10,6/Math.max(d0,0.05)));   // keep the car ~6 m away, same size every time
    hc=1.5*k; px=dr.x*t0*k; pz=dr.z*t0*k;
  }else{ px=-Math.sin(camYaw)*6; pz=-Math.cos(camYaw)*6; }
  camera.position.y=hc;
  car.position.set(px,0,pz);
  st.heading=camYaw+0.2; st.v=0; st.steer=0; car.visible=shadow.visible=true; placed=true;
  if(!msg.textContent){ msg.textContent=gyro.on?'Move your phone to look around':'Drag the screen to look around'; setTimeout(()=>{ if(!/Camera|Motion/.test(msg.textContent)) msg.textContent=''; },4000); }
}
$('recenter').addEventListener('click',recenter);

// arrow at the screen edge pointing to the car when it is out of view
const ptr=$('ptr'),pa=$('pa'),pd=$('pd');
function updatePtr(){
  if(!car.visible){ptr.style.display='none';return;}
  camera.updateMatrixWorld();
  tmp.set(car.position.x,0.7,car.position.z);
  const behind=tmp.clone().applyMatrix4(camera.matrixWorldInverse).z>0;
  tmp.project(camera);
  let nx=tmp.x,ny=tmp.y;
  if(!behind&&Math.abs(nx)<0.92&&Math.abs(ny)<0.92){ptr.style.display='none';return;}
  if(behind){nx=-nx;ny=-ny;}
  if(Math.abs(nx)<0.001&&Math.abs(ny)<0.001) ny=-1;
  const W=innerWidth,H=innerHeight,k=0.8/Math.max(Math.abs(nx),Math.abs(ny));
  const x=(nx*k*0.5+0.5)*W; let y=(-ny*k*0.5+0.5)*H; y=Math.max(90,Math.min(H-240,y));
  ptr.style.display='block'; ptr.style.left=x+'px'; ptr.style.top=y+'px';
  pa.style.transform='rotate('+Math.atan2(-ny,nx)+'rad)';
  pd.textContent=Math.round(Math.hypot(car.position.x,car.position.z))+' m';
}

// ---------- Loop ----------
const WB=2.65;                       // wheelbase (m)
let last=performance.now(), prevV=0, markDist=0, pitch=0;
function tick(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  updateCam();
  if(startedAt){
    if(gyro.on&&!gyroPlaced){gyroPlaced=true;recenter();}
    else if(!placed&&now-startedAt>1500) recenter();
  }

  // joystick: up = away from where the phone is looking, right = to the right of the view
  const mag=Math.hypot(st.jx,st.jy);
  if(mag>0.12 && !st.brake && !st.rev){
    const power=Math.min(1,(mag-0.12)/0.7);
    const want=Math.atan2(-st.jx,-st.jy)+camYaw;
    let diff=want-st.heading;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const rate=2.8*Math.min(1,0.4+Math.abs(st.v)/3);
    st.heading+=Math.max(-rate*dt,Math.min(rate*dt,diff));
    const align=Math.max(0.15,Math.cos(diff));
    st.v+=(power*9*align-st.v)*Math.min(1,2.2*dt);
    st.steer+=(-Math.max(-1,Math.min(1,diff*1.5))-st.steer)*Math.min(1,8*dt);
  }else{
    if(st.brake){
      st.v*=Math.exp(-7*dt);
      if(Math.abs(st.v)<0.05) st.v=0;
    }else{
      st.v+=((st.rev?-2.8:0)-st.v)*Math.min(1,(st.rev?2.2:1.6)*dt);
    }
    const steerIn=st.rev?st.jx:0;
    st.steer+=(steerIn-st.steer)*Math.min(1,8*dt);
    const dir=st.v<-0.01?-1:1;
    const ve=dir*Math.max(Math.abs(st.v),1.6);
    st.heading+=-ve*Math.tan(st.steer*0.5)/WB*dt;
  }

  // drive - no limits, the car moves through the world
  car.rotation.y=st.heading;
  car.position.x += -Math.sin(st.heading)*st.v*dt;
  car.position.z += -Math.cos(st.heading)*st.v*dt;

  wheels.forEach(w=>{
    w.spin.rotation.x -= st.v*dt/(WR*S);
    if(w.front) w.pivot.rotation.y = -st.steer*0.45;
  });

  tailM.emissiveIntensity = st.brake ? 4 : 0.8;
  revM.emissiveIntensity = (st.rev && st.v<-0.1) ? 3 : 0;
  const blinkOn=Math.floor(now/350)%2===0;
  indL.emissiveIntensity=(st.ind===-1&&blinkOn)?4:0;
  indR.emissiveIntensity=(st.ind===1&&blinkOn)?4:0;

  const acc=(st.v-prevV)/Math.max(dt,0.001); prevV=st.v;
  const pt=Math.max(-0.06,Math.min(0.06,acc*0.004));
  pitch+=(pt-pitch)*Math.min(1,6*dt);
  model.rotation.x=pitch;
  model.rotation.z=st.steer*st.v*0.004;

  markDist += Math.abs(st.v)*dt;
  if(markDist>0.5 && Math.abs(st.v)>1){
    markDist=0;
    const a=(st.brake&&Math.abs(st.v)>2)?0.5:0.16;
    addMark(-0.87*S,1.3*S,a,now); addMark(0.87*S,1.3*S,a,now);
  }
  marks.forEach(m=>{
    if(!m.visible) return;
    const age=(now-m.userData.born)/6000;
    if(age>=1){m.visible=false;return;}
    m.material.opacity=m.userData.base*(1-age);
  });

  shadow.position.x=car.position.x; shadow.position.z=car.position.z; shadow.rotation.z=-st.heading;

  updatePtr();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
